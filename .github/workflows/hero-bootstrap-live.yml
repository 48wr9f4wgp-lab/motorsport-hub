name: Motorsport Hub Hero Live Bootstrap

on:
  push:
    branches:
      - 'hardening/v9.3-codex-handoff'
    paths:
      - '.github/workflows/hero-bootstrap-live.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout validated publisher source
        uses: actions/checkout@v4
        with:
          path: source
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Download previously validated Hero channel candidate
        uses: actions/download-artifact@v4
        with:
          name: hero-channel-candidate-33253399412
          path: hero-channel-candidate
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 33253399412
      - name: Checkout current live Hero channel branch
        uses: actions/checkout@v4
        with:
          ref: hero-live
          path: hero-live-worktree
          fetch-depth: 1
      - name: Revalidate candidate against current live LKG
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p hero-channel-previous
          if [ -d hero-live-worktree/hero-channel ]; then
            cp -R hero-live-worktree/hero-channel/. hero-channel-previous/
          fi
          node source/tools/validate-hero-channel-publish.mjs \
            --candidate=hero-channel-candidate \
            --previous=hero-channel-previous
          node - <<'NODE'
          const r=require('./hero-channel-candidate/promotion-report.json');
          const got=[...(r.promoted||[])].sort().join(',');
          if(got!=='WEC,WRC') throw new Error(`unexpected bootstrap promotions: ${got}`);
          NODE
      - name: Atomically publish validated bootstrap channel
        shell: bash
        run: |
          set -euo pipefail
          rm -rf hero-live-worktree/hero-channel
          mkdir -p hero-live-worktree/hero-channel
          cp -R hero-channel-candidate/. hero-live-worktree/hero-channel/
          git -C hero-live-worktree add -A hero-channel
          git -C hero-live-worktree diff --cached --check
          if git -C hero-live-worktree diff --cached --quiet -- hero-channel; then
            echo 'Hero channel already matches validated bootstrap candidate.'
            exit 0
          fi
          git -C hero-live-worktree config user.name 'github-actions[bot]'
          git -C hero-live-worktree config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C hero-live-worktree commit -m 'hero: bootstrap gated live channel from run 33253399412'
          git -C hero-live-worktree push origin HEAD:hero-live
