name: Motorsport Hub Large Rollout One-Shot

on:
  push:
    branches:
      - 'improve/v9.5.15-large-all-categories'
    paths:
      - '.github/workflows/large-rollout-oneshot.yml'

permissions:
  contents: write

jobs:
  rollout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply Large layout and Hero rollout
        run: node tools/rollout-large-layout-v1.mjs
      - name: Syntax and deterministic rollout gate
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            wrc-widget-flat-v1000.js \
            supergt-widget-flat-v1000.js \
            motogp-widget-flat-v1000.js \
            fdj-widget-flat-v1000.js \
            d1gp-widget-flat-v1000.js \
            superformula-widget.js \
            indycar-widget.js \
            nascar-widget.js \
            gtwc-europe-widget.js \
            dakar-widget.js \
            tools/build-large-hero-derivatives.mjs \
            tools/augment-hero-channel-large.mjs \
            tests/hero-large-pipeline-gate.mjs \
            tests/large-layout-all-categories-gate.mjs; do
            node --check "$file"
          done
          node tests/large-layout-all-categories-gate.mjs
      - name: Commit generated rollout
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            wrc-widget-flat-v1000.js \
            supergt-widget-flat-v1000.js \
            motogp-widget-flat-v1000.js \
            fdj-widget-flat-v1000.js \
            d1gp-widget-flat-v1000.js \
            superformula-widget.js \
            indycar-widget.js \
            nascar-widget.js \
            gtwc-europe-widget.js \
            dakar-widget.js \
            tools/build-large-hero-derivatives.mjs \
            tools/augment-hero-channel-large.mjs \
            tests/hero-large-pipeline-gate.mjs \
            tests/large-layout-all-categories-gate.mjs
          git diff --cached --check
          git commit -m 'feat: extend Large widgets and Hero pipeline to all categories'
          git push origin HEAD:improve/v9.5.15-large-all-categories
