name: Apply Dakar Hero v2.1

on:
  push:
    branches:
      - hardening/v9.3-codex-handoff
    paths:
      - .github/workflows/dakar-hero-v21-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: hardening/v9.3-codex-handoff
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply patch
        run: python3 tools/apply-dakar-hero-v21.py

      - name: Syntax audit
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find . -type f \( -name '*.js' -o -name '*.mjs' \) -not -path './.git/*' -print0)

      - name: Run deterministic gates
        shell: bash
        run: |
          set +e
          failed=0
          gates=(
            tests/release-gate.mjs
            tests/boundary-gate.mjs
            tests/router-hardening-gate.mjs
            tests/registry-gate.mjs
            tests/cache-hardening-gate.mjs
            tests/hero-manifest-gate.mjs
            tests/lifecycle-hardening-gate.mjs
            tests/integrity-gate.mjs
            tests/release-package-generator-gate.mjs
            tests/diagnostics-loader-path-gate.mjs
            tests/render-smoke-gate.mjs
            tests/f1-flat-gate.mjs
            tests/wec-flat-gate.mjs
            tests/wrc-flat-gate.mjs
            tests/supergt-flat-gate.mjs
            tests/motogp-flat-gate.mjs
            tests/fdj-flat-gate.mjs
            tests/d1gp-flat-gate.mjs
            tests/dakar-gate.mjs
            tests/tap-action-gate.mjs
          )
          for gate in "${gates[@]}"; do
            echo "::group::$gate"
            node "$gate"
            rc=$?
            echo "::endgroup::"
            if [ $rc -ne 0 ]; then
              echo "::error::$gate failed with exit code $rc"
              failed=1
            fi
          done
          exit $failed

      - name: Commit verified patch
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/dakar-hero-v21-apply.yml
          rm tools/apply-dakar-hero-v21.py
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: make Dakar hero rotation visually distinct'
          git push origin HEAD:hardening/v9.3-codex-handoff
