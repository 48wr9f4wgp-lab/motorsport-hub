name: Motorsport Hub Large Hero Branch Patch

on:
  push:
    branches:
      - improve/v9.5.12-large-hero-framing

permissions:
  contents: write

concurrency:
  group: large-hero-framing-branch-patch
  cancel-in-progress: false

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve/v9.5.12-large-hero-framing
          fetch-depth: 0
      - name: Apply canonical Hero runtime patcher
        run: python3 tools/apply-hero-channel-runtime.py
      - name: Verify targeted runtime contract
        run: |
          node --check motorsport-hub.js
          node tests/hero-channel-runtime-gate.mjs
      - name: Commit generated Router change
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- motorsport-hub.js; then
            echo 'Router already matches patcher.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add motorsport-hub.js
          git diff --cached --check
          git commit -m 'Improve Large Hero framing without Medium regression'
          git push origin HEAD:improve/v9.5.12-large-hero-framing
