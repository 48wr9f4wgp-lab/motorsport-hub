name: Sync Green Runtime to hardening-live

on:
  workflow_run:
    workflows:
      - Motorsport Hub Hardening CI
    types:
      - completed

permissions:
  contents: write

jobs:
  sync-runtime:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'hardening/v9.3-codex-handoff' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: hardening/v9.3-codex-handoff

      - name: Sync tested runtime files only
        shell: bash
        env:
          GREEN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          runtime_files=(
            motorsport-hub.js
            f1-widget-flat-v1000.js
            wec-widget-flat-v1000.js
            wrc-widget-flat-v1000.js
            supergt-widget-flat-v1000.js
            motogp-widget-flat-v1000.js
            fdj-widget-flat-v1000.js
            d1gp-widget-flat-v1000.js
            superformula-widget.js
            indycar-widget.js
            nascar-widget.js
            gtwc-europe-widget.js
            motorsport-diagnostics-v890.js
            category-registry.json
            hero-assets.json
          )

          git fetch origin hardening-live
          git checkout -B hardening-live origin/hardening-live
          git checkout "$GREEN_SHA" -- "${runtime_files[@]}"

          if git diff --quiet -- "${runtime_files[@]}"; then
            echo 'hardening-live already matches the latest green runtime.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${runtime_files[@]}"
          git commit -m "test: sync green hardening runtime ${GREEN_SHA:0:12}"
          git push origin HEAD:hardening-live
