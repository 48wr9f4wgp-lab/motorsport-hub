name: Apply shared Large vertical layout once

on:
  push:
    branches:
      - 'improve/v9.5.24-large-vertical-layout'
    paths:
      - '.github/workflows/apply-large-vertical-layout-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve/v9.5.24-large-vertical-layout
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply bottom-anchored Large layout to all 12 modules
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const modules=[
            'f1-widget-flat-v1000.js','wec-widget-flat-v1000.js','wrc-widget-flat-v1000.js','supergt-widget-flat-v1000.js',
            'motogp-widget-flat-v1000.js','fdj-widget-flat-v1000.js','d1gp-widget-flat-v1000.js','superformula-widget.js',
            'indycar-widget.js','nascar-widget.js','gtwc-europe-widget.js','dakar-widget.js'
          ];
          function extractFunction(src,name){
            const start=src.indexOf(`function ${name}(`);
            if(start<0)throw new Error(`${name}: function not found`);
            const brace=src.indexOf('{',start);
            let depth=0;
            for(let i=brace;i<src.length;i++){
              const ch=src[i];
              if(ch==='{')depth++;
              else if(ch==='}'){
                depth--;
                if(depth===0)return{start,end:i+1,text:src.slice(start,i+1)};
              }
            }
            throw new Error(`${name}: unbalanced braces`);
          }
          const marker='/* MH_LARGE_LOWER_ANCHOR_FLEX=1 */';
          for(const file of modules){
            let src=fs.readFileSync(file,'utf8');
            if(src.includes(marker))throw new Error(`${file}: layout marker already present`);
            const fn=extractFunction(src,'large');
            const labelAt=fn.text.indexOf('MORE STANDINGS');
            if(labelAt<0)throw new Error(`${file}: MORE STANDINGS missing in Large renderer`);
            const prefix=fn.text.slice(0,labelAt);
            const re=/w\.addSpacer\((\d+(?:\.\d+)?)\);/g;
            const matches=[...prefix.matchAll(re)];
            if(!matches.length)throw new Error(`${file}: no fixed root spacer before lower panel`);
            const target=matches[matches.length-1];
            if(labelAt-(target.index+target[0].length)>900)throw new Error(`${file}: candidate spacer too far from lower panel`);
            const replacement=`w.addSpacer();${marker}`;
            const local=fn.text.slice(0,target.index)+replacement+fn.text.slice(target.index+target[0].length);
            src=src.slice(0,fn.start)+local+src.slice(fn.end);
            fs.writeFileSync(file,src);
            console.log(`${file}: lower panel converted to flexible bottom anchor (was ${target[0]})`);
          }
          NODE

          cat > tests/large-vertical-layout-gate.mjs <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const modules=[
            'f1-widget-flat-v1000.js','wec-widget-flat-v1000.js','wrc-widget-flat-v1000.js','supergt-widget-flat-v1000.js',
            'motogp-widget-flat-v1000.js','fdj-widget-flat-v1000.js','d1gp-widget-flat-v1000.js','superformula-widget.js',
            'indycar-widget.js','nascar-widget.js','gtwc-europe-widget.js','dakar-widget.js'
          ];
          function extractFunction(src,name){
            const start=src.indexOf(`function ${name}(`); assert(start>=0,`${name}: function missing`);
            const brace=src.indexOf('{',start); let depth=0;
            for(let i=brace;i<src.length;i++){
              if(src[i]==='{')depth++;
              else if(src[i]==='}'&&--depth===0)return src.slice(start,i+1);
            }
            throw new Error(`${name}: unbalanced braces`);
          }
          for(const file of modules){
            const src=fs.readFileSync(file,'utf8');
            const large=extractFunction(src,'large');
            assert.equal((large.match(/MH_LARGE_LOWER_ANCHOR_FLEX=1/g)||[]).length,1,`${file}: Large flex-anchor marker missing or duplicated`);
            assert(large.includes('w.addSpacer();/* MH_LARGE_LOWER_ANCHOR_FLEX=1 */'),`${file}: lower panel is not flex anchored`);
            const markerAt=large.indexOf('MH_LARGE_LOWER_ANCHOR_FLEX=1');
            const lowerAt=large.indexOf('MORE STANDINGS');
            assert(markerAt>=0&&lowerAt>markerAt&&lowerAt-markerAt<1000,`${file}: flex anchor is not directly upstream of lower information panel`);
            assert(src.includes('const LARGE_TYPO_SCALE=1.12;'),`${file}: Large typography contract regressed`);
          }
          console.log('Motorsport Hub Large vertical layout gate: PASS (12/12 bottom-anchored lower panels, adaptive flex space)');
          NODE

          node tests/large-vertical-layout-gate.mjs
          for f in f1-widget-flat-v1000.js wec-widget-flat-v1000.js wrc-widget-flat-v1000.js supergt-widget-flat-v1000.js motogp-widget-flat-v1000.js fdj-widget-flat-v1000.js d1gp-widget-flat-v1000.js superformula-widget.js indycar-widget.js nascar-widget.js gtwc-europe-widget.js dakar-widget.js tests/large-vertical-layout-gate.mjs; do
            node --check "$f"
          done

          node <<'NODE'
          const fs=require('fs');
          for(const file of ['.github/workflows/hardening-ci.yml','.github/workflows/release-candidate-ci.yml']){
            let s=fs.readFileSync(file,'utf8');
            if(s.includes('tests/large-vertical-layout-gate.mjs'))continue;
            const anchor='            tests/large-typography-gate.mjs\n';
            if(!s.includes(anchor))throw new Error(`${file}: large typography gate anchor missing`);
            s=s.replace(anchor,anchor+'            tests/large-vertical-layout-gate.mjs\n');
            fs.writeFileSync(file,s);
          }
          NODE

          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            f1-widget-flat-v1000.js wec-widget-flat-v1000.js wrc-widget-flat-v1000.js supergt-widget-flat-v1000.js \
            motogp-widget-flat-v1000.js fdj-widget-flat-v1000.js d1gp-widget-flat-v1000.js superformula-widget.js \
            indycar-widget.js nascar-widget.js gtwc-europe-widget.js dakar-widget.js \
            tests/large-vertical-layout-gate.mjs .github/workflows/hardening-ci.yml .github/workflows/release-candidate-ci.yml
          git commit -m 'ui: rebalance Large widget vertical layout across all categories'
          git push origin HEAD:improve/v9.5.24-large-vertical-layout
