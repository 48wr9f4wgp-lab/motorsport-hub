name: Apply Parser Repair Branch Patch

on:
  push:
    branches:
      - monitor/parser-drift-detection
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: monitor/parser-drift-detection
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply evidence-backed parser repairs
        run: python3 tools/apply-parser-repair.py
      - name: Verify repaired parser regressions
        run: |
          node --check wec-widget-flat-v1000.js
          node --check supergt-widget-flat-v1000.js
          node tests/wec-flat-gate.mjs
          node tests/supergt-flat-gate.mjs
      - name: Commit parser repairs to working branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add wec-widget-flat-v1000.js supergt-widget-flat-v1000.js tests/wec-flat-gate.mjs tests/supergt-flat-gate.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'fix: repair WEC and SUPER GT live parsers'
          git push origin HEAD:monitor/parser-drift-detection
