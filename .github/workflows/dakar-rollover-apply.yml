name: Apply Dakar rollover patch
on:
  push:
    branches: [hardening/dakar-2027-rollover]
    paths: [.github/workflows/dakar-rollover-apply.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/apply-dakar-rollover.mjs
      - run: node tests/dakar-gate.mjs
      - run: |
          git config user.name github-actions-bot
          git config user.email 41898282+github-actions-bot@users.noreply.github.com
          git add dakar-widget.js tests/dakar-gate.mjs
          git diff --cached --check
          git commit -m "fix: harden Dakar 2027 standings rollover"
          git push origin HEAD:hardening/dakar-2027-rollover
