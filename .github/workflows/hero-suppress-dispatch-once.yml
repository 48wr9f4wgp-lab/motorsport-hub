name: One-shot approved forbidden Hero suppression

on:
  push:
    branches:
      - 'ops/hero-suppress-v9.5.20'
    paths:
      - '.github/workflows/hero-suppress-dispatch-once.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch canonical Hero refresh on suppression ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run hero-discovery.yml \
            --repo "${{ github.repository }}" \
            --ref "${{ github.ref_name }}"
