name: Motorsport Hub Hardening CI

on:
  push:
    branches:
      - 'hardening/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hardening-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax audit
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "node --check $file"
            node --check "$file"
          done < <(find . -type f \( -name '*.js' -o -name '*.mjs' \) -not -path './.git/*' -print0)

      - name: Release gate
        run: node tests/release-gate.mjs

      - name: Boundary gate
        run: node tests/boundary-gate.mjs

      - name: Router hardening gate
        run: node tests/router-hardening-gate.mjs

      - name: Registry gate
        run: node tests/registry-gate.mjs

      - name: Cache hardening gate
        run: node tests/cache-hardening-gate.mjs

      - name: Hero manifest gate
        run: node tests/hero-manifest-gate.mjs

      - name: Lifecycle hardening gate
        run: node tests/lifecycle-hardening-gate.mjs

      - name: F1 flat gate
        run: node tests/f1-flat-gate.mjs

      - name: WEC flat gate
        run: node tests/wec-flat-gate.mjs

      - name: WRC flat gate
        run: node tests/wrc-flat-gate.mjs

      - name: SUPER GT flat gate
        run: node tests/supergt-flat-gate.mjs

      - name: MotoGP flat gate
        run: node tests/motogp-flat-gate.mjs

      - name: FDJ flat gate
        run: node tests/fdj-flat-gate.mjs

      - name: D1GP flat gate
        run: node tests/d1gp-flat-gate.mjs
