name: Motorsport Hub Hardening CI

on:
  push:
    branches:
      - 'hardening/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: motorsport-hardening-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hardening-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax audit
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "node --check $file"
            node --check "$file"
          done < <(find . -type f \( -name '*.js' -o -name '*.mjs' \) \
            -not -path './.git/*' \
            -print0)

      - name: Run all deterministic gates
        shell: bash
        run: |
          set +e
          failed=0
          gates=(
            tests/release-gate.mjs
            tests/boundary-gate.mjs
            tests/router-hardening-gate.mjs
            tests/registry-gate.mjs
            tests/cache-hardening-gate.mjs
            tests/hero-manifest-gate.mjs
            tests/hero-discovery-gate.mjs
            tests/hero-refresh-schedule-gate.mjs
            tests/hero-channel-runtime-gate.mjs
            tests/hero-large-pipeline-gate.mjs
            tests/large-typography-gate.mjs
            tests/large-vertical-layout-gate.mjs
            tests/image-probe-gate.mjs
            tests/hero-subject-crop-gate.mjs
            tests/hero-selection-gate.mjs
            tests/hero-rollout-inventory-gate.mjs
            tests/hero-runtime-crop-gate.mjs
            tests/f1-wec-hero-runtime-gate.mjs
            tests/domestic-hero-runtime-gate.mjs
            tests/hero-public-attribution-gate.mjs
            tests/lifecycle-hardening-gate.mjs
            tests/integrity-gate.mjs
            tests/release-package-generator-gate.mjs
            tests/stable-loader-v7-gate.mjs
            tests/observability-support-export-gate.mjs
            tests/diagnostics-loader-path-gate.mjs
            tests/workflow-hygiene-gate.mjs
            tests/public-ga-docs-gate.mjs
            tests/temporal-accuracy-gate.mjs
            tests/render-smoke-gate.mjs
            tests/f1-flat-gate.mjs
            tests/wec-flat-gate.mjs
            tests/wrc-flat-gate.mjs
            tests/supergt-flat-gate.mjs
            tests/motogp-flat-gate.mjs
            tests/fdj-flat-gate.mjs
            tests/d1gp-flat-gate.mjs
            tests/dakar-gate.mjs
            tests/tap-action-gate.mjs
          )
          for gate in "${gates[@]}"; do
            echo "::group::$gate"
            node "$gate"
            rc=$?
            echo "::endgroup::"
            if [ $rc -ne 0 ]; then
              echo "::error::$gate failed with exit code $rc"
              failed=1
            fi
          done
          exit $failed
