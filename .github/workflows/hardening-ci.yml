name: Motorsport Hub Hardening CI

on:
  push:
    branches:
      - 'hardening/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hardening-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax audit
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "node --check $file"
            node --check "$file"
          done < <(find . -type f \( -name '*.js' -o -name '*.mjs' \) -not -path './.git/*' -print0)

      - name: Run all deterministic gates
        shell: bash
        run: |
          set +e
          failed=0
          gates=(
            tests/release-gate.mjs
            tests/boundary-gate.mjs
            tests/router-hardening-gate.mjs
            tests/registry-gate.mjs
            tests/cache-hardening-gate.mjs
            tests/hero-manifest-gate.mjs
            tests/lifecycle-hardening-gate.mjs
            tests/render-smoke-gate.mjs
            tests/f1-flat-gate.mjs
            tests/wec-flat-gate.mjs
            tests/wrc-flat-gate.mjs
            tests/supergt-flat-gate.mjs
            tests/motogp-flat-gate.mjs
            tests/fdj-flat-gate.mjs
            tests/d1gp-flat-gate.mjs
          )
          for gate in "${gates[@]}"; do
            echo "::group::$gate"
            node "$gate"
            rc=$?
            echo "::endgroup::"
            if [ $rc -ne 0 ]; then
              echo "::error::$gate failed with exit code $rc"
              failed=1
            fi
          done
          exit $failed
