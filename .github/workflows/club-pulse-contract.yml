name: Club Pulse Contract QA

on:
  push:
    branches: [club-pulse-runtime]
    paths:
      - 'scriptable/**'
      - '.github/workflows/club-pulse-contract.yml'
  pull_request:
    paths:
      - 'scriptable/**'
      - '.github/workflows/club-pulse-contract.yml'

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Run Club Pulse contract checks
        run: |
          node scriptable/club-pulse-contract.test.js
          node scriptable/club-pulse-expanded-clubs.test.js
          node scriptable/club-pulse-wave2-expansion.test.js
          node scriptable/club-pulse-wave3-netherlands.test.js
          node scriptable/club-pulse-wave4-lens.test.js
          node scriptable/club-pulse-cache-migration.test.js
          node scriptable/club-pulse-resilience.test.js
          node scriptable/club-pulse-data-policy.test.js
          node scriptable/club-pulse-data-policy-contract.test.js
          node scriptable/club-pulse-loader-efficiency.test.js
          node scriptable/club-pulse-small-widget-contract.test.js
          node scriptable/club-pulse-launcher-version.test.js
