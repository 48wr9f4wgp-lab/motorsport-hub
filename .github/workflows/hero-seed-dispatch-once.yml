name: One-shot approved Hero seed refresh

on:
  push:
    branches:
      - 'ops/hero-seed-refresh-v9.5.19'
    paths:
      - '.github/workflows/hero-seed-dispatch-once.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch canonical Hero refresh on this ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run hero-discovery.yml \
            --repo "${{ github.repository }}" \
            --ref "${{ github.ref_name }}"
