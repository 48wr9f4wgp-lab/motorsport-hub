name: Motorsport Hub Hero Rollout Pilot

on:
  push:
    branches:
      - 'hardening/v9.3-codex-handoff'
    paths:
      - 'hero-pilot-policies/**'
      - 'hero-pilot-manifests/**'
      - 'hero-assets.json'
      - 'tools/hero-crop-core.mjs'
      - 'tools/detect-hero-subjects.mjs'
      - 'tools/test-hero-oversize-small.mjs'
      - 'tools/test-hero-min-confidence.mjs'
      - '.github/workflows/hero-rollout-pilot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wrc-motogp-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install build-time subject detector
        run: npm install --no-save --no-package-lock @tensorflow/tfjs-node@4.22.0 @tensorflow-models/coco-ssd@2.2.3
      - name: Analyze WRC current Hero assets
        env:
          TF_CPP_MIN_LOG_LEVEL: '2'
        run: |
          node tools/detect-hero-subjects.mjs \
            --mode=current \
            --policy=hero-pilot-policies/wrc.json \
            --output=hero-subject-report-wrc.json \
            --derivative-dir=hero-derived/wrc \
            --derived-manifest=hero-derived-manifest-wrc.json
      - name: Validate WRC pilot report integrity
        run: node -e "const r=require('./hero-subject-report-wrc.json'); if(r.category!=='WRC'||r.summary.analyzed!==2||r.summary.visualReviewCandidates!==2||r.summary.subjectAwareDerivatives!==2||r.results.some(x=>x.error)) process.exit(1); console.log(r.summary)"
      - name: Avoid Wikimedia burst between categories
        run: sleep 5
      - name: Analyze MotoGP current Hero assets
        env:
          TF_CPP_MIN_LOG_LEVEL: '2'
        run: |
          node tools/detect-hero-subjects.mjs \
            --mode=current \
            --policy=hero-pilot-policies/motogp.json \
            --output=hero-subject-report-motogp.json \
            --derivative-dir=hero-derived/motogp \
            --derived-manifest=hero-derived-manifest-motogp.json
      - name: Validate MotoGP pilot report integrity
        run: node -e "const r=require('./hero-subject-report-motogp.json'); if(r.category!=='MOTOGP'||r.summary.analyzed!==2||r.summary.visualReviewCandidates!==2||r.summary.subjectAwareDerivatives!==2||r.results.some(x=>x.error)) process.exit(1); console.log(r.summary)"
      - name: Upload WRC and MotoGP pilot artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: hero-rollout-wrc-motogp-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: error
          path: |
            hero-subject-report-wrc.json
            hero-derived-manifest-wrc.json
            hero-subject-report-motogp.json
            hero-derived-manifest-motogp.json
            hero-derived/

  wec-f1-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Hero crop core semantics
        run: |
          node tools/test-hero-oversize-small.mjs
          node tools/test-hero-min-confidence.mjs
      - name: Install build-time subject detector
        run: npm install --no-save --no-package-lock @tensorflow/tfjs-node@4.22.0 @tensorflow-models/coco-ssd@2.2.3
      - name: Analyze WEC current Hero assets
        env:
          TF_CPP_MIN_LOG_LEVEL: '2'
        run: |
          node tools/detect-hero-subjects.mjs \
            --mode=current \
            --policy=hero-pilot-policies/wec.json \
            --output=hero-subject-report-wec.json \
            --derivative-dir=hero-derived-wec \
            --derived-manifest=hero-derived-manifest-wec.json
      - name: Validate WEC pilot report integrity
        run: node -e "const r=require('./hero-subject-report-wec.json'); if(r.category!=='WEC'||r.summary.analyzed!==2||r.summary.visualReviewCandidates!==2||r.summary.subjectAwareDerivatives!==2||r.results.some(x=>x.error)) process.exit(1); console.log(r.summary)"
      - name: Avoid Wikimedia burst between categories
        run: sleep 5
      - name: Analyze F1 final action Hero set
        env:
          TF_CPP_MIN_LOG_LEVEL: '2'
        run: |
          node tools/detect-hero-subjects.mjs \
            --mode=current \
            --manifest=hero-pilot-manifests/f1-action-candidates.json \
            --policy=hero-pilot-policies/f1-action.json \
            --output=hero-subject-report-f1-action.json \
            --derivative-dir=hero-derived-f1-action \
            --derived-manifest=hero-derived-manifest-f1-action.json
      - name: Validate F1 final action Hero set
        run: node -e "const r=require('./hero-subject-report-f1-action.json'); const expected=new Set(['f1-ferrari-hamilton-japan-fp1-2025','f1-mclaren-piastri-japan-fp1-2025','f1-mercedes-russell-japan-fp3-2025']); const got=new Set(r.results.filter(x=>x.status==='VISUAL_REVIEW_CANDIDATE'&&x.derivatives).map(x=>x.assetId)); if(r.category!=='F1_ACTION'||r.summary.analyzed!==3||got.size!==3||[...expected].some(x=>!got.has(x))||r.results.some(x=>x.error)) process.exit(1); console.log(r.summary)"
      - name: Upload WEC and F1 pilot artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: hero-rollout-wec-f1-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: error
          path: |
            hero-subject-report-wec.json
            hero-derived-manifest-wec.json
            hero-subject-report-f1-action.json
            hero-derived-manifest-f1-action.json
            hero-derived-wec/
            hero-derived-f1-action/

  domestic-hero-analysis:
    name: ${{ matrix.category }}-analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        category: [supergt, fdj, d1gp]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Hero crop core semantics
        run: |
          node tools/test-hero-oversize-small.mjs
          node tools/test-hero-min-confidence.mjs
      - name: Install build-time subject detector
        run: npm install --no-save --no-package-lock @tensorflow/tfjs-node@4.22.0 @tensorflow-models/coco-ssd@2.2.3
      - name: Analyze current Hero asset
        env:
          TF_CPP_MIN_LOG_LEVEL: '2'
          CAT: ${{ matrix.category }}
        run: |
          node tools/detect-hero-subjects.mjs \
            --mode=current \
            --policy=hero-pilot-policies/${CAT}.json \
            --output=hero-subject-report-${CAT}.json \
            --derivative-dir=hero-derived-${CAT} \
            --derived-manifest=hero-derived-manifest-${CAT}.json
      - name: Validate pilot report integrity
        env:
          CAT: ${{ matrix.category }}
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const cat=process.env.CAT;
          const expected={supergt:'SUPERGT',fdj:'FDJ',d1gp:'D1GP'}[cat];
          const r=JSON.parse(fs.readFileSync(`hero-subject-report-${cat}.json`,'utf8'));
          if(r.category!==expected||r.summary.analyzed!==1||r.summary.visualReviewCandidates!==1||r.summary.subjectAwareDerivatives!==1||r.results.some(x=>x.error)) process.exit(1);
          console.log(r.summary);
          NODE
      - name: Print category report
        if: ${{ always() }}
        env:
          CAT: ${{ matrix.category }}
        run: cat hero-subject-report-${CAT}.json || true
      - name: Upload category pilot artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: hero-rollout-${{ matrix.category }}-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: error
          path: |
            hero-subject-report-${{ matrix.category }}.json
            hero-derived-manifest-${{ matrix.category }}.json
            hero-derived-${{ matrix.category }}/
