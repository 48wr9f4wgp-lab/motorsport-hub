name: Motorsport Hub Hero Manual One-Shot

on:
  push:
    branches:
      - 'ops/hero-refresh-v9.5.13'
    paths:
      - '.github/workflows/hero-manual-oneshot.yml'

concurrency:
  group: motorsport-hero-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install build-time subject detector
        run: npm install --no-save --no-package-lock @tensorflow/tfjs-node@4.22.0 @tensorflow-models/coco-ssd@2.2.3

      - name: Discover, validate and derive F1/WEC Hero candidates
        shell: bash
        env:
          TF_CPP_MIN_LOG_LEVEL: '2'
        run: |
          set -euo pipefail
          mkdir -p refresh-artifacts
          categories=(F1 WEC)
          for category in "${categories[@]}"; do
            echo "::group::Hero refresh $category"
            lower="$(printf '%s' "$category" | tr '[:upper:]' '[:lower:]')"
            dir="refresh-artifacts/hero-refresh-${category}-oneshot"
            mkdir -p "$dir/hero-crop-previews"
            node tools/build-hero-refresh-config.mjs \
              --category="$category" \
              --output="$dir/hero-refresh-config.json"
            node tools/commons-hero-discovery.mjs \
              --config="$dir/hero-refresh-config.json" \
              --output="$dir/hero-discovery-report.json" \
              --write
            node tools/validate-discovered-hero-images.mjs \
              --input="$dir/hero-discovery-report.json" \
              --output="$dir/hero-image-validation-report.json"
            policy="hero-pilot-policies/${lower}.json"
            node --import ./tools/install-fetch-retry-hook.mjs tools/detect-hero-subjects.mjs \
              --mode=discovery \
              --policy="$policy" \
              --discovery="$dir/hero-discovery-report.json" \
              --validation="$dir/hero-image-validation-report.json" \
              --output="$dir/hero-subject-report.json" \
              --preview-dir="$dir/hero-crop-previews" \
              --derived-manifest="$dir/hero-derived-manifest.json" \
              --limit=4
            node tools/build-large-hero-derivatives.mjs \
              --report="$dir/hero-subject-report.json" \
              --output-dir="$dir/hero-crop-previews"
            echo "::endgroup::"
          done

      - name: Load current hero-live as LKG
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p hero-channel-previous
          if git ls-remote --exit-code --heads origin hero-live >/dev/null 2>&1; then
            git fetch origin hero-live:refs/remotes/origin/hero-live
            if git cat-file -e origin/hero-live:hero-channel/channel.json 2>/dev/null; then
              mkdir -p /tmp/hero-live-export
              git archive origin/hero-live hero-channel | tar -x -C /tmp/hero-live-export
              cp -R /tmp/hero-live-export/hero-channel/. hero-channel-previous/
            fi
          fi

      - name: Build and validate publication candidate
        shell: bash
        run: |
          set -euo pipefail
          node tools/build-hero-channel.mjs \
            --artifacts=refresh-artifacts \
            --previous-dir=hero-channel-previous \
            --output-dir=hero-channel-candidate
          node tools/augment-hero-channel-large.mjs \
            --artifacts=refresh-artifacts \
            --candidate=hero-channel-candidate
          node tests/hero-channel-promotion-gate.mjs
          node tests/hero-large-pipeline-gate.mjs
          node tools/validate-hero-channel-publish.mjs \
            --candidate=hero-channel-candidate \
            --previous=hero-channel-previous
          cat hero-channel-candidate/promotion-report.json

      - name: Publish validated updates to hero-live
        shell: bash
        run: |
          set -euo pipefail
          count="$(node -e "const r=require('./hero-channel-candidate/promotion-report.json');process.stdout.write(String((r.updatedCategories||r.promoted||[]).length))")"
          if [ "$count" -eq 0 ]; then
            echo 'No publishable Hero updates.'
            exit 0
          fi
          git clone --depth 1 --branch hero-live "https://github.com/${GITHUB_REPOSITORY}.git" hero-live-worktree
          rm -rf hero-channel-current
          mkdir -p hero-channel-current
          if [ -d hero-live-worktree/hero-channel ]; then
            cp -R hero-live-worktree/hero-channel/. hero-channel-current/
          fi
          node tools/validate-hero-channel-publish.mjs \
            --candidate=hero-channel-candidate \
            --previous=hero-channel-current
          rm -rf hero-live-worktree/hero-channel
          mkdir -p hero-live-worktree/hero-channel
          cp -R hero-channel-candidate/. hero-live-worktree/hero-channel/
          git -C hero-live-worktree add -A hero-channel
          if git -C hero-live-worktree diff --cached --quiet -- hero-channel; then
            echo 'hero-live already matches validated candidate.'
            exit 0
          fi
          git -C hero-live-worktree diff --cached --check
          git -C hero-live-worktree config user.name 'github-actions[bot]'
          git -C hero-live-worktree config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C hero-live-worktree commit -m "hero: approved one-shot Large refresh ${GITHUB_RUN_ID}"
          git -C hero-live-worktree push origin HEAD:hero-live
