name: WRC Ogier Hero Source Fix

on:
  push:
    branches:
      - 'hardening/v9.3-codex-handoff'
    paths:
      - '.github/workflows/wrc-ogier-source-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-wrc-source:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'hardening/v9.3-codex-handoff'
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Replace only the broken Ogier fallback URL
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p='wrc-widget-flat-v1000.js';
          const oldUrl='https://upload.wikimedia.org/wikipedia/commons/thumb/9/91/2025_Toyota_GR_Yaris_Rally_1_Ogier_%28cropped%29.jpg/645px-2025_Toyota_GR_Yaris_Rally_1_Ogier_%28cropped%29.jpg';
          const newUrl='https://commons.wikimedia.org/wiki/Special:Redirect/file/2025%20Toyota%20GR%20Yaris%20Rally%201%20Ogier.jpg?width=2048';
          let s=fs.readFileSync(p,'utf8');
          const count=s.split(oldUrl).length-1;
          if(count!==1)throw new Error(`Expected exactly one old Ogier URL, found ${count}`);
          if(s.includes(newUrl))throw new Error('New Ogier URL already present before patch');
          s=s.replace(oldUrl,newUrl);
          if(s.includes(oldUrl)||!s.includes(newUrl))throw new Error('Ogier URL replacement verification failed');
          fs.writeFileSync(p,s);
          NODE
      - name: Validate patched WRC module
        run: |
          node --check wrc-widget-flat-v1000.js
          node tests/wrc-flat-gate.mjs
      - name: Commit exact patch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- wrc-widget-flat-v1000.js; then
            echo 'No WRC source change to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add wrc-widget-flat-v1000.js
          git commit -m 'fix: update WRC Ogier fallback Hero URL'
          git push origin HEAD:hardening/v9.3-codex-handoff
