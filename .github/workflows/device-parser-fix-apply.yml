name: Apply device parser fallback patch

on:
  push:
    branches:
      - fix/device-parser-fallback-v9.5.29
    paths:
      - .github/workflows/device-parser-fix-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply parser fallback patch
        run: node tools/apply-device-parser-fallback-v2.mjs
      - name: Verify focused regression gates
        run: |
          set -euo pipefail
          node --check wec-widget-flat-v1000.js
          node --check supergt-widget-flat-v1000.js
          node tests/wec-flat-gate.mjs
          node tests/supergt-flat-gate.mjs
      - name: Commit patched runtime and tests
        run: |
          set -euo pipefail
          git config user.name github-actions-bot
          git config user.email 41898282+github-actions-bot@users.noreply.github.com
          git add wec-widget-flat-v1000.js supergt-widget-flat-v1000.js tests/wec-flat-gate.mjs tests/supergt-flat-gate.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: add device-safe standings parser fallbacks"
          git push origin HEAD:fix/device-parser-fallback-v9.5.29
