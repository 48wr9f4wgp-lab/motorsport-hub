name: Synchronize Dakar runtime header
on:
  push:
    branches: [hardening/dakar-2027-rollover]
    paths: [.github/workflows/dakar-header-sync.yml]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          sed -i '1s/v9\.5\.4-hardening/v9.5.5-hardening/' dakar-widget.js
          grep -q '^// Motorsport Hub v9.5.5-hardening' dakar-widget.js
          git config user.name github-actions-bot
          git config user.email 41898282+github-actions-bot@users.noreply.github.com
          git add dakar-widget.js
          git diff --cached --check
          git commit -m "chore: align Dakar runtime version header"
          git push origin HEAD:hardening/dakar-2027-rollover
