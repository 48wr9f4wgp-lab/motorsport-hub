name: Motorsport Hub Live Parser Monitor

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches:
      - 'monitor/**'
  pull_request:
    branches:
      - main
    paths:
      - 'motorsport-hub.js'
      - 'category-registry.json'
      - '*widget*.js'
      - 'tools/live-parser-monitor.mjs'
      - 'tests/live-parser-monitor-gate.mjs'
      - '.github/workflows/parser-monitor.yml'

concurrency:
  group: motorsport-parser-monitor-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  branch-parser-repair:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/monitor/parser-drift-detection' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: monitor/parser-drift-detection
      - name: Apply evidence-backed WEC and SUPER GT parser repairs
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f'expected source block not found: {path}')
              p.write_text(text.replace(old, new, 1))

          replace_once('wec-widget-flat-v1000.js', r'// Motorsport Hub v10.0.2-hardening', r'// Motorsport Hub v10.0.4-hardening')
          replace_once('wec-widget-flat-v1000.js', r"const V='10.0.2-hardening'", r"const V='10.0.4-hardening'")
          replace_once(
              'wec-widget-flat-v1000.js',
              r""" {pos:1,name:'TOYOTA',points:'132 pts',maker:'TOYOTA',machine:'TR010 Hybrid',team:'TOYOTA RACING'},
 {pos:2,name:'BMW',points:'127 pts',maker:'BMW',machine:'M Hybrid V8',team:'BMW M Team WRT'},
 {pos:3,name:'FERRARI',points:'88 pts',maker:'FERRARI',machine:'499P',team:'Ferrari AF Corse'}""",
              r""" {pos:1,name:'TOYOTA',points:'140 pts',maker:'TOYOTA',machine:'TR010 Hybrid',team:'TOYOTA RACING'},
 {pos:2,name:'BMW',points:'131 pts',maker:'BMW',machine:'M Hybrid V8',team:'BMW M Team WRT'},
 {pos:3,name:'FERRARI',points:'114 pts',maker:'FERRARI',machine:'499P',team:'Ferrari AF Corse'}""",
          )
          replace_once(
              'wec-widget-flat-v1000.js',
              r" const h=await txt(DATA_SOURCE);if(!/Manufacturers['’]?\s*standings/i.test(h)||!/FIA Hypercar World Endurance Manufacturers/i.test(h))throw Error('WEC table identity');const a=[];",
              r" const h=await txt(DATA_SOURCE),plain=clean(h);if(!/Manufacturers['’]?\s*standings/i.test(plain)||!/FIA Hypercar World Endurance Manufacturers/i.test(plain))throw Error('WEC table identity');const a=[];",
          )
          replace_once(
              'tests/wec-flat-gate.mjs',
              r"const validHtml=`<html><body><h1>Manufacturers' standings</h1><h2>FIA Hypercar World Endurance Manufacturers Championship</h2><table>",
              r"const validHtml=`<html><body><h1><span>Manufacturers'</span><br><span>standings</span></h1><h2>FIA Hypercar <span>World Endurance</span> Manufacturers Championship</h2><table>",
          )

          replace_once('supergt-widget-flat-v1000.js', r'// Motorsport Hub v10.0.3-hardening', r'// Motorsport Hub v10.0.4-hardening')
          replace_once('supergt-widget-flat-v1000.js', r"const V='10.0.3-hardening'", r"const V='10.0.4-hardening'")
          replace_once(
              'supergt-widget-flat-v1000.js',
              r""" const h=await txt(DATA_SOURCE);if(!/GT\s*500/i.test(h)||!/(?:ドライバーランキング|Driver Ranking)/i.test(h))throw Error('SUPER GT table identity');const lo=Math.max(h.search(/GT\s*500/i),0),gt300=h.search(/GT\s*300/i),seg=gt300>lo?h.slice(lo,gt300):h.slice(lo),a=[];
 for(const c of rows(seg)){
  if(c.length<6)continue;const p=num(c[0]),no=String(c[1]||'').match(/\d+/)?.[0]||'',pts=num(c[c.length-3]);if(!(p>=1&&p<=30)||!no||!isFinite(pts))continue;""",
              r""" const h=await txt(DATA_SOURCE),plain=clean(h),tableRows=rows(h);if(!/GT\s*500/i.test(plain)||!/(?:ドライバーランキング|Driver Ranking)/i.test(plain))throw Error('SUPER GT table identity');let totalIndex=-1;
 for(const c of tableRows){const i=c.findIndex(v=>/^(?:合計|Total(?:\s*points?)?)$/i.test(String(v||'').trim()));if(i>=0&&c.some(v=>/(?:ドライバー|Driver)/i.test(String(v||'')))){totalIndex=i;break}}
 if(totalIndex<3)throw Error('SUPER GT total column');const a=[];
 for(const c of tableRows){
  if(c.length<=totalIndex)continue;const p=num(c[0]),no=String(c[1]||'').match(/\d+/)?.[0]||'',pts=num(c[totalIndex]);if(!(p>=1&&p<=30)||!no||!isFinite(pts))continue;""",
          )
          replace_once(
              'tests/supergt-flat-gate.mjs',
              r"const validHtml=`<html><body><h1>GT500 ドライバーランキング</h1><table>",
              r"const validHtml=`<html><body><nav>GT500 GT300</nav><h1>GT500 ドライバーランキング</h1><table>",
          )
      - name: Verify repaired parser regressions before push
        run: |
          node --check wec-widget-flat-v1000.js
          node --check supergt-widget-flat-v1000.js
          node tests/wec-flat-gate.mjs
          node tests/supergt-flat-gate.mjs
      - name: Commit repaired parsers to working branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add wec-widget-flat-v1000.js supergt-widget-flat-v1000.js tests/wec-flat-gate.mjs tests/supergt-flat-gate.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'fix: repair WEC and SUPER GT live parsers'
          git push origin HEAD:monitor/parser-drift-detection

  deterministic-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax audit monitor code
        run: |
          node --check tools/live-parser-monitor.mjs
          node --check tests/live-parser-monitor-gate.mjs
      - name: Verify live-monitor contract deterministically
        run: node tests/live-parser-monitor-gate.mjs

  live-upstream:
    if: ${{ github.event_name != 'pull_request' }}
    needs: deterministic-contract
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exercise all production parsers against live upstreams
        run: node tools/live-parser-monitor.mjs --attempts=2 --write=parser-monitor-report.json
      - name: Upload sanitized parser-monitor report
        if: ${{ always() && hashFiles('parser-monitor-report.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: motorsport-parser-monitor-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: error
          path: parser-monitor-report.json
